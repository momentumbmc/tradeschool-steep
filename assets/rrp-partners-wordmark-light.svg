<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 32" width="210" height="32" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Allura&amp;family=Inter:wght@500&amp;family=Newsreader:ital@1&amp;display=swap');
      .script {
        font-family: 'Allura', 'Snell Roundhand', 'Brush Script MT', cursive;
        font-size: 26px;
        font-weight: 400;
        fill: #141619;
        letter-spacing: 0.055em;
      }
      .amp {
        font-family: 'Newsreader', Georgia, serif;
        font-style: italic;
        font-size: 15px;
        font-weight: 400;
        fill: #925827;
      }
      .partners {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        fill: rgba(20, 22, 25, 0.85);
      }
    </style>
  </defs>
  <!-- RRP & PARTNERS Brand Wordmark (Light Surfaces) -->
  <text x="2" y="24" class="script">RRP</text>
  <text x="59" y="22" class="amp">&amp;</text>
  <text x="76" y="21" class="partners">PARTNERS</text>
</svg>
